<!-- MEDIA HERO -->
<section class="media-hero" id="top">
  <canvas id="constellation"></canvas>
  <div class="media-hero-grid">
    <div class="media-hero-copy">
      <div class="eyebrow">Media Production</div>
      <h1>Dabaa Media<br><span>Production</span></h1>
      <p class="lede">Professional visual content that makes your brand stand out.</p>
      <div class="hero-btn-row">
        <a href="#categories" class="btn btn-gold">View Portfolio</a>
        <a href="index.html" class="btn btn-outline">Marketing Agency</a>
      </div>
    </div>

    <div class="camera-stage" id="cameraStage" aria-hidden="true">
      <svg viewBox="0 0 400 400" fill="none">
        <!-- outer lens ring -->
        <g class="lens-ring lens-ring--outer">
          <circle cx="200" cy="200" r="150" stroke="rgba(216,180,255,0.25)" stroke-width="1.5"/>
          <circle cx="200" cy="200" r="150" stroke="rgba(245,194,99,0.35)" stroke-width="1.5" stroke-dasharray="4 10"/>
        </g>
        <!-- inner lens ring -->
        <g class="lens-ring lens-ring--inner">
          <circle cx="200" cy="200" r="118" stroke="rgba(138,92,246,0.4)" stroke-width="1"/>
        </g>
        <!-- aperture blades -->
        <g class="aperture-blade">
          <circle cx="200" cy="200" r="86" fill="rgba(36,18,69,0.6)" stroke="rgba(216,180,255,0.3)" stroke-width="1"/>
          <circle cx="200" cy="200" r="60" fill="rgba(18,8,33,0.7)" stroke="rgba(245,194,99,0.4)" stroke-width="1"/>
          <circle cx="200" cy="200" r="34" fill="rgba(138,92,246,0.25)"/>
        </g>
        <!-- lens glint -->
        <ellipse cx="176" cy="176" rx="14" ry="8" fill="rgba(239,233,251,0.25)" transform="rotate(-35 176 176)"/>
        <!-- focus brackets -->
        <g stroke="var(--gold)" stroke-width="2" stroke-linecap="round">
          <path class="focus-bracket focus-bracket--tl" d="M40 90 V50 H80"/>
          <path class="focus-bracket focus-bracket--tr" d="M320 50 H360 V90"/>
          <path class="focus-bracket focus-bracket--bl" d="M80 350 H40 V310"/>
          <path class="focus-bracket focus-bracket--br" d="M360 310 V350 H320"/>
        </g>
        <!-- rec indicator -->
        <g transform="translate(40,40)">
          <circle class="rec-dot" cx="0" cy="0" r="6" fill="#ef4444"/>
          <text x="14" y="4" fill="rgba(239,233,251,0.7)" font-family="Inter, sans-serif" font-size="12" letter-spacing="2">REC</text>
        </g>
        <!-- shutter flash -->
        <rect class="shutter-flash" x="0" y="0" width="400" height="400" rx="24"/>
      </svg>
    </div>
  </div>
</section>

<!-- CATEGORIES -->

<footer>© 2026 Mohamed Aldabaa. All rights reserved.</footer>

      Contact Us on WhatsApp
    </a>
    <video class="video-modal__video" id="videoModalPlayer" playsinline controls preload="none"></video>
  </div>
</div>

<script src="dabaa-media.js"></script>
<script>
  // Shared nav scroll + mobile menu behavior, identical to the main site.
  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if(window.scrollY > 40){ nav.classList.add('scrolled'); }
    else{ nav.classList.remove('scrolled'); }
  });

  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });
  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });

  // Reuses the same signature constellation background as the homepage hero.
  const canvas = document.getElementById('constellation');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, points;

  function resize(){
    w = canvas.width = canvas.offsetWidth * devicePixelRatio;
    h = canvas.height = canvas.offsetHeight * devicePixelRatio;
  }
  function initPoints(){
    const isMobile = canvas.offsetWidth < 700;
    const cap = isMobile ? 24 : 55;
    const count = Math.min(cap, Math.floor((canvas.offsetWidth * canvas.offsetHeight) / 18000));
    points = Array.from({length: count}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.22 * devicePixelRatio,
      vy: (Math.random() - 0.5) * 0.22 * devicePixelRatio,
      r: (Math.random() * 1.5 + 0.8) * devicePixelRatio,
      gold: Math.random() < 0.12
    }));
  }
  function draw(){
    ctx.clearRect(0, 0, w, h);
    const linkDist = 120 * devicePixelRatio;
    for(let i = 0; i < points.length; i++){
      const p = points[i];
      if(!reduceMotion){
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > w) p.vx *= -1;
        if(p.y < 0 || p.y > h) p.vy *= -1;
      }
      for(let j = i + 1; j < points.length; j++){
        const q = points[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < linkDist){
          ctx.strokeStyle = `rgba(180,140,255,${(1 - dist/linkDist) * 0.3})`;
          ctx.lineWidth = 1 * devicePixelRatio;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
    for(const p of points){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.gold ? 'rgba(245,194,99,0.9)' : 'rgba(216,180,255,0.85)';
      ctx.shadowBlur = 8 * devicePixelRatio;
      ctx.shadowColor = p.gold ? 'rgba(245,194,99,0.8)' : 'rgba(180,140,255,0.8)';
      ctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(draw);
  }
  function start(){ resize(); initPoints(); draw(); }
  window.addEventListener('resize', () => { resize(); initPoints(); if(reduceMotion) draw(); });
  start();
</script>

</body>
</html>
